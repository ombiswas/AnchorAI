services:
  # ----------------------------------------------------------------------------
  # MongoDB Database Service
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7-jammy
    container_name: anchorai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Express Backend API Service
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: anchorai-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/anchor_ai}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads

  # ----------------------------------------------------------------------------
  # Vite React Frontend SPA Service (Nginx)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    container_name: anchorai-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server

volumes:
  mongo_data:
  server_uploads:
